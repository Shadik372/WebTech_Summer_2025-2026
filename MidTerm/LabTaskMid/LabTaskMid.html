<!DOCTYPE html>
<html lang="en">
<head>
    <title>Interactive Portfolio Object</title>
    <style>
        body{
            background-color: white;
            color: black;
            text-align: center;
        }
        button{
            padding: 10px;
            margin: 5px;
        }
        section{
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <button onclick="toggleTheme()">Dark/Light</button>
    <h2 id="greeting"></h2>
    <hr>
    <button onclick="showSection('about')">About</button>
    <button onclick="showSection('projects')">Projects</button>
    <button onclick="showSection('contact')">Contact</button>

    <div id="about" class="section">
        <h2>About Me</h2>
        <p>Hello! I am Farhan Shadik Souad</p>
    </div>

    <div id="projects" class="section" style="display:none">
        <h2>Projects</h2>
        <p>
            Portfolio Website
        </p>
        <p>Calculator</p>
    </div>
    <div id="contact" class="section" style="display: none;">
       <h2>Contact</h2>
       <input type="text" id="name" placeholder="Your Name"><br><br>
       <input type="email" id="email" placeholder="Your Email"><br><br>
       <textarea rows="5" cols="20" id="message" placeholder="Your Message"></textarea><br><br>
       <button onclick="validateForm()">Submit</button>
       <p id="error"></p>
    </div>

    <script>
        function toggleTheme(){
            const body = document.body;
            if(body.style.backgroundColor === 'white'){
                body.style.backgroundColor = 'black';
                body.style.color = 'white';
            } else {
                body.style.backgroundColor = 'white';
                body.style.color = 'black';
            }
        }
        let hour = new Date().getHours();
        if(hour < 12)
        {
            document.getElementById("greeting").innerText = "Good Morning!";
        }
        else if(hour < 18)
        {
            document.getElementById("greeting").innerText = "Good Afternoon!";
        }
        else
        {
            document.getElementById("greeting").innerText = "Good Night!";
        }

        function showSection(sectionId){
            const sections = document.getElementsByClassName('section');
            for(let section of sections){
                section.style.display = 'none';
            }
            document.getElementById(sectionId).style.display = 'block';
        }

        function validateForm(){
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let message = document.getElementById("message").value;
            let error = "";
            if(name === ""){
                error += "Name is required. <br>";
            }
            if(email.includes("@") == false || email.includes(".") == false){
                error += "Valid email is required. <br>";
            }
            if(message.length < 10){
                error += "Message must be at least 10 characters. <br>";
            }

            if(error){
                document.getElementById("error").innerHTML = error;
                document.getElementById("error").style.color = "red";
            } else {
                document.getElementById("error").innerHTML = "Form submitted successfully!";
                document.getElementById("error").style.color = "green";
            }
        }
    </script>
</body>
</html>
